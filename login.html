<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — BetPulse</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .auth-box { background: #141414; padding: 32px; border-radius: 16px; border: 1px solid #1a1a1a; max-width: 400px; width: 100%; text-align: center; }
    .auth-box h1 { color: #ff1744; font-size: 2rem; font-weight: 800; margin-bottom: 4px; }
    .auth-box h1 span { color: #fff; }
    .auth-sub { color: #888; margin-bottom: 24px; font-size: .9rem; }
    .input-group { display: flex; align-items: center; background: #0a0a0a; border-radius: 8px; border: 1px solid #1a1a1a; margin-bottom: 12px; padding: 0 14px; transition: border-color 0.2s; }
    .input-group:focus-within { border-color: #ff1744; }
    .input-group i { color: #555; margin-right: 10px; }
    .input-group input { width: 100%; padding: 12px 0; background: transparent; border: none; color: #fff; font-size: 0.95rem; outline: none; }
    .input-group input::placeholder { color: #555; }
    .btn-primary { width: 100%; padding: 14px; background: #ff1744; color: #fff; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
    .btn-primary:hover { background: #d50000; }
    .btn-primary:disabled { background: #555; cursor: not-allowed; }
    .auth-link { margin-top: 16px; color: #555; font-size: 0.9rem; }
    .auth-link a { color: #ff1744; text-decoration: none; }
    .auth-link a:hover { text-decoration: underline; }
    .device-notice { background: rgba(255,171,0,.08); border: 1px solid rgba(255,171,0,.2); color: #ffab00; padding: 10px 12px; border-radius: 8px; font-size: .72rem; margin-bottom: 16px; text-align: left; display: flex; gap: 8px; }
    .device-notice i { color: #ffab00; flex-shrink: 0; margin-top: 2px; }
    .err-msg { color: #ff1744; font-size: .8rem; margin-top: 8px; min-height: 18px; text-align: center; }
  </style>
</head>
<body>
  <div class="auth-box">
    <h1>BET <span>PULSE</span></h1>
    <p class="auth-sub">Login to your account</p>

    <div class="device-notice">
      <i class="fas fa-shield-alt"></i>
      <div>
        <strong>Device lock active.</strong> One login per account per day. Once you log in, this device is bound to your account until tomorrow.
      </div>
    </div>

    <form id="loginForm">
      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" id="username" placeholder="Username" autocomplete="username" required />
      </div>
      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn-primary" id="loginBtn">
        <i class="fas fa-sign-in-alt"></i> Login
      </button>
      <div class="err-msg" id="errMsg"></div>
    </form>

    <p class="auth-link">Don't have an account? <a href="/register">Register</a></p>
    <p class="auth-link"><a href="/terms">Terms &amp; Conditions</a></p>
  </div>

  <script>
    // Generate a lightweight device fingerprint
    function getDeviceFingerprint() {
      try {
        const parts = [
          navigator.userAgent || '',
          navigator.language || '',
          screen.width + 'x' + screen.height,
          screen.colorDepth || '',
          new Date().getTimezoneOffset(),
          navigator.platform || '',
          navigator.hardwareConcurrency || '',
          navigator.maxTouchPoints || ''
        ];
        const str = parts.join('|');
        // Simple hash
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
          hash = ((hash << 5) - hash) + str.charCodeAt(i);
          hash = hash & hash;
        }
        return 'fp_' + Math.abs(hash).toString(36);
      } catch (e) {
        return 'fp_unknown';
      }
    }

    const form = document.getElementById('loginForm');
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('errMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) { err.textContent = 'Username and password required'; return; }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';

      try {
        const fingerprint = getDeviceFingerprint();
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, fingerprint })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          localStorage.setItem('deviceFingerprint', fingerprint);
          window.location.href = '/';
        } else {
          err.textContent = data.error || 'Login failed';
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
        }
      } catch (error) {
        err.textContent = 'Login error: ' + error.message;
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
      }
    });
  </script>
</body>
</html>
